name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Formatting check
      run: cargo fmt --check
    - name: Lints
      run: cargo clippy --all-targets -- -Dclippy::pedantic
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run loom tests
      run: cargo test actor::queue --features loom-tests
    - name: Build examples
      run: cargo build --examples
    - name: Add embedded target
      run: rustup target add thumbv7em-none-eabihf
    - name: Embedded example lints
      run: cargo clippy --example blinky --features blinky-example --target thumbv7em-none-eabihf -- -Dclippy::pedantic
    - name: Build embedded example
      run: cargo build --example blinky --features blinky-example --target thumbv7em-none-eabihf
